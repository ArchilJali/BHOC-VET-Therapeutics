<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
<title id="title">K-9 Saxon treated with Oxyglobin, Biopure Annual Report 2002</title>
<desc id="desc">Historical panel from the 2002 Biopure Annual Report showing Fresno Police K-9 Saxon and the Oxyglobin treatment account after catastrophic line-of-duty injuries.</desc>
<rect width="2048" height="682" fill="#f8a910"/>
<style>
.head{font:700 39px Arial,Helvetica,sans-serif;fill:#173d74;letter-spacing:-.4px}
.body{font:25px Arial,Helvetica,sans-serif;fill:#111}
.sig{font:italic 700 27px Arial,Helvetica,sans-serif;fill:#111}
.sig2{font:italic 25px Arial,Helvetica,sans-serif;fill:#111}
.note{font:italic 20px Arial,Helvetica,sans-serif;fill:#242424}
</style>
<text class="head" x="38" y="55">INJURED POLICE DOG</text>
<text class="head" x="38" y="101">TREATED WITH OXYGLOBIN</text>
<image x="551" y="64" width="187" height="244" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,ուրք"/>
<text class="body" x="770" y="48">
<tspan x="770" dy="0">On August 22, 2002, Fresno Police Department</tspan><tspan x="770" dy="35">K-9 Officer Saxon was shot at point-blank range</tspan><tspan x="770" dy="35">by a felony suspect using a shotgun. The gunshot</tspan><tspan x="770" dy="35">nearly proved fatal to K-9 Saxon, puncturing his</tspan><tspan x="770" dy="35">lungs, breaking two legs, and ripping open his</tspan><tspan x="770" dy="35">entire left side. Conversations between members</tspan><tspan x="770" dy="35">of my staff and veterinarian Dr. Roger Gfeller leave</tspan><tspan x="770" dy="35">no doubt about the pivotal role that Oxyglobin</tspan><tspan x="770" dy="35">played in saving K-9 Saxon’s life.</tspan>
</text>
<text class="body" x="770" y="448">
<tspan x="770" dy="0">The enormous boost to the morale of the K-9 Unit,</tspan><tspan x="770" dy="35">the Fresno Police Department, and the community</tspan><tspan x="770" dy="35">at large when it was announced that K-9 Saxon would</tspan><tspan x="770" dy="35">recover was evident in the events that followed:</tspan>
</text>
<text class="body" x="1378" y="48">
<tspan x="1378" dy="0">schoolchildren writing get-well cards; citizens sending</tspan><tspan x="1378" dy="35">cards and donations on K-9 Saxon’s behalf; and other</tspan><tspan x="1378" dy="35">law-enforcement agencies’ K-9s coming to the aid of</tspan><tspan x="1378" dy="35">our agency.</tspan>
</text>
<text class="body" x="1378" y="248">
<tspan x="1378" dy="0">I would be honored if you would pass along my sincerest</tspan><tspan x="1378" dy="35">thanks to all of Biopure Corporation’s employees who</tspan><tspan x="1378" dy="35">have made Oxyglobin the life-saving product that it is.</tspan><tspan x="1378" dy="35">Thank you again for your role in giving K-9 Saxon back</tspan><tspan x="1378" dy="35">to a grateful community.</tspan>
</text>
<text class="sig" x="1378" y="505">Jerry Dyer</text>
<text class="sig2" x="1378" y="548">Chief of Police, Fresno, California</text>
<text class="sig2" x="1378" y="590">November 26, 2002</text>
<text class="note" x="38" y="640">Historical source adapted from the 2002 Biopure Annual Report.</text>
</svg>