<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
<title id="title">K-9 Saxon treated with Oxyglobin, Biopure Annual Report 2002</title>
<desc id="desc">Historical panel from the 2002 Biopure Annual Report showing Fresno Police K-9 Saxon and the Oxyglobin treatment account after catastrophic line-of-duty injuries.</desc>
<rect width="2048" height="682" fill="#f8a910"/>
<style>
.head{font:700 39px Arial,Helvetica,sans-serif;fill:#173d74;letter-spacing:-.4px}
.body{font:25px Arial,Helvetica,sans-serif;fill:#111}
.sig{font:italic 700 27px Arial,Helvetica,sans-serif;fill:#111}
.sig2{font:italic 25px Arial,Helvetica,sans-serif;fill:#111}
.note{font:italic 20px Arial,Helvetica,sans-serif;fill:#242424}
</style>
<text class="head" x="38" y="55">INJURED POLICE DOG</text>
<text class="head" x="38" y="101">TREATED WITH OXYGLOBIN</text>
<rect x="551" y="64" width="187" height="244" fill="#f8a910"/>
<image x="551" y="64" width="187" height="244" preserveAspectRatio="xMidYMid meet" href="data:image/jpeg;base64,"/>
<text class="body" x="772" y="50">
<tspan x="772" dy="0">On August 22, 2002, Fresno Police Department</tspan>
<tspan x="772" dy="39">K-9 Officer Saxon was shot at point-blank range</tspan>
<tspan x="772" dy="39">by a felony suspect using a shotgun. The gunshot</tspan>
<tspan x="772" dy="39">nearly proved fatal to K-9 Saxon, puncturing his</tspan>
<tspan x="772" dy="39">lungs, breaking two legs, and ripping open his</tspan>
<tspan x="772" dy="39">entire left side. Conversations between members</tspan>
<tspan x="772" dy="39">of my staff and veterinarian Dr. Roger Gfeller leave</tspan>
<tspan x="772" dy="39">no doubt about the pivotal role that Oxyglobin</tspan>
<tspan x="772" dy="39">played in saving K-9 Saxon’s life.</tspan>
</text>
<text class="body" x="772" y="458">
<tspan x="772" dy="0">The enormous boost to the morale of the K-9 Unit,</tspan>
<tspan x="772" dy="39">the Fresno Police Department, and the community</tspan>
<tspan x="772" dy="39">at large when it was announced that K-9 Saxon would</tspan>
<tspan x="772" dy="39">recover was evident in the events that followed:</tspan>
</text>
<text class="body" x="1404" y="50">
<tspan x="1404" dy="0">schoolchildren writing get-well cards; citizens sending</tspan>
<tspan x="1404" dy="39">cards and donations on K-9 Saxon’s behalf; and other</tspan>
<tspan x="1404" dy="39">law-enforcement agencies’ K-9s coming to the aid of</tspan>
<tspan x="1404" dy="39">our agency.</tspan>
</text>
<text class="body" x="1404" y="258">
<tspan x="1404" dy="0">I would be honored if you would pass along my sincerest</tspan>
<tspan x="1404" dy="39">thanks to all of Biopure Corporation’s employees who</tspan>
<tspan x="1404" dy="39">have made Oxyglobin the life-saving product that it is.</tspan>
<tspan x="1404" dy="39">Thank you again for your role in giving K-9 Saxon back</tspan>
<tspan x="1404" dy="39">to a grateful community.</tspan>
</text>
<text class="sig" x="1404" y="512">Jerry Dyer</text>
<text class="sig2" x="1404" y="555">Chief of Police, Fresno, California</text>
<text class="sig2" x="1404" y="596">November 26, 2002</text>
<text class="note" x="38" y="652">Historical source adapted from the 2002 Biopure Annual Report.</text>
</svg>