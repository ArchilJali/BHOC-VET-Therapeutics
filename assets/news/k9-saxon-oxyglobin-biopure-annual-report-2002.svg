<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
<title id="title">K-9 Saxon treated with Oxyglobin, Biopure Annual Report 2002</title>
<desc id="desc">Historical panel documenting Fresno Police K-9 Saxon and the Oxyglobin treatment account after catastrophic line-of-duty injuries in 2002.</desc>
<rect width="1800" height="600" fill="#f7a80f"/>
<style>
.head{font:700 34px Arial,Helvetica,sans-serif;fill:#173d74}
.body{font:25px Arial,Helvetica,sans-serif;fill:#111}
.sig{font:italic 700 26px Arial,Helvetica,sans-serif;fill:#111}
.sig2{font:italic 25px Arial,Helvetica,sans-serif;fill:#111}
.note{font:italic 20px Arial,Helvetica,sans-serif;fill:#222}
</style>
<text class="head" x="34" y="72">INJURED POLICE DOG</text>
<text class="head" x="34" y="113">TREATED WITH OXYGLOBIN</text>
<image href="data:image/jpeg;base64," x="500" y="32" width="180" height="223" preserveAspectRatio="xMidYMid slice"/>
<text class="body" x="710" y="66">
<tspan x="710" dy="0">On August 22, 2002, Fresno Police Department</tspan>
<tspan x="710" dy="34">K-9 Officer Saxon was shot at point-blank range</tspan>
<tspan x="710" dy="34">by a felony suspect using a shotgun. The gunshot</tspan>
<tspan x="710" dy="34">nearly proved fatal to K-9 Saxon, puncturing his</tspan>
<tspan x="710" dy="34">lungs, breaking two legs, and ripping open his</tspan>
<tspan x="710" dy="34">entire left side. Conversations between members</tspan>
<tspan x="710" dy="34">of my staff and veterinarian Dr. Roger Gfeller leave</tspan>
<tspan x="710" dy="34">no doubt about the pivotal role that Oxyglobin</tspan>
<tspan x="710" dy="34">played in saving K-9 Saxon’s life.</tspan>
</text>
<text class="body" x="710" y="396">
<tspan x="710" dy="0">The enormous boost to the morale of the K-9 Unit,</tspan>
<tspan x="710" dy="34">the Fresno Police Department, and the community</tspan>
<tspan x="710" dy="34">at large when it was announced that K-9 Saxon would</tspan>
<tspan x="710" dy="34">recover was evident in the events that followed:</tspan>
</text>
<text class="body" x="1260" y="66">
<tspan x="1260" dy="0">schoolchildren writing get-well cards; citizens sending</tspan>
<tspan x="1260" dy="34">cards and donations on K-9 Saxon’s behalf; and other</tspan>
<tspan x="1260" dy="34">law-enforcement agencies’ K-9s coming to the aid of</tspan>
<tspan x="1260" dy="34">our agency.</tspan>
</text>
<text class="body" x="1260" y="240">
<tspan x="1260" dy="0">I would be honored if you would pass along my sincerest</tspan>
<tspan x="1260" dy="34">thanks to all of Biopure Corporation’s employees who</tspan>
<tspan x="1260" dy="34">have made Oxyglobin the life-saving product that it is.</tspan>
<tspan x="1260" dy="34">Thank you again for your role in giving K-9 Saxon back</tspan>
<tspan x="1260" dy="34">to a grateful community.</tspan>
</text>
<text class="sig" x="1260" y="462">Jerry Dyer</text>
<text class="sig2" x="1260" y="500">Chief of Police, Fresno, California</text>
<text class="sig2" x="1260" y="537">November 26, 2002</text>
<text class="note" x="34" y="566">Historical source adapted from the 2002 Biopure Annual Report.</text>
</svg>