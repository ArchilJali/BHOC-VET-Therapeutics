name: Sync BHOC Veterinary navigation context

on:
  push:
    branches: [main]
    paths:
      - 'assets/navigation-context.js'
      - 'scripts/ensure-navigation-context.mjs'
      - '.github/workflows/sync-navigation-context.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-vet-navigation-context
  cancel-in-progress: false

jobs:
  sync-navigation-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Integrate shared navigation context at source level
        run: node scripts/ensure-navigation-context.mjs

      - name: Validate source JavaScript
        run: |
          node --check src/client/app.js
          node --check src/initiative/app.js
          node --check assets/navigation-context.js

      - name: Commit source integration
        run: |
          git add src/client/app.js src/initiative/app.js
          if git diff --cached --quiet; then
            echo "Navigation context source integration is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate shared navigation context across BHOC Veterinary"
          git pull --rebase origin main
          git push
