name: Sync generated BHOC Veterinary site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/build.mjs'
      - 'scripts/check-site.mjs'
      - 'scripts/check-forbidden-links.mjs'
      - 'package.json'
      - '.github/workflows/sync-generated-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bhoc-vet-generated-sync
  cancel-in-progress: false

jobs:
  sync-generated-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build checked site
        run: |
          node scripts/build.mjs --out _site
          cp dist/404.html _site/404.html
          node scripts/check-site.mjs _site
          node scripts/check-forbidden-links.mjs _site

      - name: Synchronize generated root and dist
        run: |
          rm -rf dist
          mkdir -p dist
          cp -a _site/. dist/

          for f in index.html product.html applications.html evidence.html science.html initiative.html related-information.html news.html contact.html publications.html robots.txt sitemap.xml CNAME app.js .nojekyll; do
            cp "_site/$f" "$f"
          done

          mkdir -p assets/css
          cp -a _site/assets/css/. assets/css/
          cp _site/assets/favicon.svg assets/favicon.svg
          cp _site/assets/bhoc-veterinary-organization-logo.svg assets/bhoc-veterinary-organization-logo.svg

      - name: Commit synchronized generated files
        run: |
          git add index.html product.html applications.html evidence.html science.html initiative.html related-information.html news.html contact.html publications.html robots.txt sitemap.xml CNAME app.js .nojekyll assets/css assets/favicon.svg assets/bhoc-veterinary-organization-logo.svg dist
          if git diff --cached --quiet; then
            echo "Generated root and dist are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync generated BHOC Veterinary site"
          git pull --rebase origin main
          git push
