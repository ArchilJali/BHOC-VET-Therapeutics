name: Update BHOC Vet social preview once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-vet-social-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update preview and metadata
        run: |
          python -m pip install --disable-pip-version-check pillow
          python <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          src=Image.open('assets/bhoc-initiative-land-social.jpg').convert('RGB')
          target=(1200,630)
          scale=min(target[0]/src.width,target[1]/src.height)
          size=(round(src.width*scale),round(src.height*scale))
          resized=src.resize(size,Image.Resampling.LANCZOS)
          canvas=Image.new('RGB',target,(248,249,250))
          canvas.paste(resized,((target[0]-size[0])//2,(target[1]-size[1])//2))
          canvas.save('assets/bhoc-vet-social-1200x630.jpg','JPEG',quality=90,optimize=True,progressive=True)
          p=Path('content/site.json')
          site=json.loads(p.read_text())
          site['updated']='2026-09-13'
          site['publication']['updates']=19
          site['publication']['lastUpdated']='2026-09-13'
          site['publication']['version']='26.09.13'
          site['socialImage']={'src':'assets/bhoc-vet-social-1200x630.jpg','alt':'BHOC Veterinary land wildlife scene for Precision Oxygen Therapeutics, animal health and species protection','width':1200,'height':630}
          p.write_text(json.dumps(site,indent=2,ensure_ascii=False)+'\n')
          w=Path('WORK-STATE.md')
          text=w.read_text()
          text=text.replace('9 September 2026. This file records only the current implementation.','13 September 2026. This file records only the current implementation.')
          text=text.replace('Current Open Graph and WhatsApp image: `assets/bhoc-initiative-land-social.jpg` (1200 × 463), an uncropped copy of the approved Land hero.','Current Open Graph and WhatsApp image: `assets/bhoc-vet-social-1200x630.jpg` (1200 × 630), a social-card derivative of the approved Land hero with the full source composition preserved inside the standard preview canvas.')
          text=text.replace('Publication line: `First published 07 Sep 2026 · 18 updates · Last updated 09 Sep 2026 · Version 26.09.09`.','Publication line: `First published 07 Sep 2026 · 19 updates · Last updated 13 Sep 2026 · Version 26.09.13`.')
          w.write_text(text)
          PY
          node scripts/build.mjs --out _site
          cp dist/404.html _site/404.html
          node scripts/check-site.mjs _site
          node scripts/check-forbidden-links.mjs _site
          rm .github/workflows/update-vet-social-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update BHOC Veterinary social preview and publication date'
          git pull --rebase origin main
          git push
