name: Build and publish BHOC Veterinary
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bhoc-veterinary-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Assemble independent content blocks
        run: node scripts/build.mjs --out _site
      - name: Preserve the custom error page
        run: cp dist/404.html _site/404.html
      - name: Write retired Evidence migration redirects
        run: |
          cat > _site/evidence.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=https://archiljali.github.io/BHOC-platform/veterinary/Vet-index.html"><link rel="canonical" href="https://archiljali.github.io/BHOC-platform/veterinary/Vet-index.html"><title>Vet Real-World Evidence & Cases | BHOC Veterinary</title></head><body><p>This page has moved to <a href="https://archiljali.github.io/BHOC-platform/veterinary/Vet-index.html">Vet Real-World Evidence & Cases</a>.</p></body></html>
          EOF
          cat > _site/publications.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=https://archiljali.github.io/BHOC-platform/veterinary/Vet-index.html"><link rel="canonical" href="https://archiljali.github.io/BHOC-platform/veterinary/Vet-index.html"><title>Vet Real-World Evidence & Cases | BHOC Veterinary</title></head><body><p>Veterinary publications and cases are maintained in <a href="https://archiljali.github.io/BHOC-platform/veterinary/Vet-index.html">Vet Real-World Evidence & Cases</a>.</p></body></html>
          EOF
      - name: Validate HTML, metadata, images and block isolation
        run: node scripts/check-site.mjs _site
      - name: Reject forbidden outbound domains
        run: node scripts/check-forbidden-links.mjs _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish checked website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
