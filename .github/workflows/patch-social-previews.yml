name: Patch BHOC Vet social previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_social_previews.py'
      - '.github/workflows/patch-social-previews.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply social metadata
        run: python scripts/patch_social_previews.py
      - name: Commit previews
        run: |
          git config user.name "BHOC Social Metadata"
          git config user.email "actions@users.noreply.github.com"
          git add index.html initiative/index.html assets/initiative-social-logo.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use compact BHOC Vet social previews"
          git pull --rebase origin main
          git push origin main
